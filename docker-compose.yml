services:
  db:
    image: postgres:16-alpine
    container_name: smart-dormitory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespw}
      POSTGRES_DB: ${POSTGRES_DB:-projectdb}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    build:
      context: ./docker/pgbouncer
      dockerfile: Dockerfile
    container_name: smart-dormitory-pgbouncer
    restart: unless-stopped
    environment:
      POSTGRESQL_HOST: db
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-postgres}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-postgrespw}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-projectdb}
      PGBOUNCER_PORT: 6432
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_DEFAULT_POOL_SIZE: 50
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PGBOUNCER_HOST_PORT:-6433}:6432"
    healthcheck:
      test:
        ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart-dormitory-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
      UV_THREADPOOL_SIZE: "64"
      RATE_LIMIT_STORE: "redis"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespw}@pgbouncer:6432/${POSTGRES_DB:-projectdb}?schema=public
      REDIS_URL: redis://redis:6379
      PAYMENT_API_URL: http://payment:8002
      UPLOAD_ROOT: /app/uploads/private
      OCR_API_URL: http://host.docker.internal:8000
      OCR_API_BASE_URL: http://host.docker.internal:8000
      FACE_API_URL: http://face-recognition:8000
      FACE_API_KEY: ${FACE_API_KEY:-face-recognition-secret-key-change-me-in-production}
    deploy:
      replicas: 2
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

  payment:
    build:
      context: ../paymentProject/Dormitory-PAYMENT
      dockerfile: Dockerfile
    container_name: smart-dormitory-payment
    restart: unless-stopped
    env_file:
      - ../paymentProject/Dormitory-PAYMENT/.env
    environment:
      PORT: "8002"
    ports:
      - "${PAYMENT_HOST_PORT:-8002}:8002"
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8002/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  face-recognition:
    build:
      context: ../Face_Recognition
      dockerfile: Dockerfile
    container_name: smart-dormitory-face-recognition
    restart: unless-stopped
    ports:
      - "${FACE_RECOGNITION_PORT:-8001}:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///face_recognition.db
      APP_PORT: "8000"
      APP_HOST: "0.0.0.0"
      APP_RELOAD: "false"
      API_KEY: ${FACE_API_KEY:-face-recognition-secret-key-change-me-in-production}
      MODEL_DIR: "models"
      SIMILARITY_THRESHOLD: "0.60"
    volumes:
      - ../Face_Recognition/models:/app/models
      - face_recognition_data:/app

  nginx:
    image: nginx:1.27-alpine
    container_name: smart-dormitory-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${NGINX_HOST_PORT:-3000}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../smart-dormitory-frontend/dist:/usr/share/nginx/html:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: smart-dormitory-prometheus
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PROMETHEUS_HOST_PORT:-9091}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: smart-dormitory-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro

  ngrok:
    image: ngrok/ngrok:latest
    container_name: smart-dormitory-ngrok
    restart: unless-stopped
    command: http --url=${NGROK_DOMAIN} nginx:80
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - nginx

volumes:
  pgdata:
  redisdata:
  uploads:
  prometheusdata:
  grafanadata:
  face_recognition_data:
